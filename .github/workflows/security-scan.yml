name: security-scan

on:
  workflow_dispatch:
  pull_request:

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the repository for critical vulnerabilities
        run: docker run --rm -v ${{ github.workspace }}:/src aquasec/trivy:0.58.1 fs --severity CRITICAL --ignore-unfixed --exit-code 1 /src
