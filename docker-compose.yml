name: taskmanagement

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskmanagement
      POSTGRES_PASSWORD: taskmanagement
      POSTGRES_DB: taskmanagement
    ports:
      - "5432:5432"
    volumes:
      - taskmanagement-pg:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanagement -d taskmanagement"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-lab-keycloak-admin}
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/local/docker/keycloak/generated:/opt/keycloak/data/import:ro
    networks:
      - data
    restart: unless-stopped

  api:
    image: taskmanagement-api:local
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TaskManagement: Host=postgres;Port=5432;Database=taskmanagement;Username=taskmanagement;Password=taskmanagement
      Authentication__Authority: http://localhost:8080/realms/taskmanagement
      Authentication__Audience: taskmanagement-api
      Authentication__RequireHttpsMetadata: "false"
      OpenTelemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - internal
    restart: unless-stopped

  web:
    image: taskmanagement-web:local
    networks:
      - internal
    restart: unless-stopped

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infrastructure/observability/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - loki
    networks:
      - data
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - data
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./infrastructure/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - data
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-lab-grafana-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - data
    restart: unless-stopped

networks:
  data:
  internal:
    external: true
    name: taskmanagement-internal

volumes:
  taskmanagement-pg:
