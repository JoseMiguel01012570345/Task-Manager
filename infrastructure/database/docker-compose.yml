services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskmanagement
      POSTGRES_PASSWORD: taskmanagement
      POSTGRES_DB: taskmanagement
    ports:
      - "5432:5432"
    volumes:
      - taskmanagement-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanagement -d taskmanagement"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  taskmanagement-pg:
