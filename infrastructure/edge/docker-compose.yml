services:
  traefik:
    image: traefik:v3.2.0
    command: ["--configFile=/etc/traefik/static.yml"]
    ports:
      - "8088:80"
    volumes:
      - ./traefik/static.yml:/etc/traefik/static.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - public
      - internal
    restart: unless-stopped

networks:
  public:
    name: taskmanagement-public
  internal:
    name: taskmanagement-internal
    internal: true
