http:
  routers:
    probe:
      rule: PathPrefix(`/waf-probe`)
      entryPoints:
        - web
      middlewares:
        - waf-block
      service: web
      priority: 100
    api:
      rule: PathPrefix(`/api`) || PathPrefix(`/health`)
      entryPoints:
        - web
      middlewares:
        - waf-detect
      service: api
      priority: 50
    app:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
      middlewares:
        - waf-detect
      service: web

  services:
    api:
      loadBalancer:
        servers:
          - url: http://k3d-taskmanagement-server-0:80
          - url: http://k3d-taskmanagement-agent-0:80
          - url: http://k3d-taskmanagement-agent-1:80
    web:
      loadBalancer:
        servers:
          - url: http://k3d-taskmanagement-server-0:80
          - url: http://k3d-taskmanagement-agent-0:80
          - url: http://k3d-taskmanagement-agent-1:80

  middlewares:
    waf-detect:
      plugin:
        coraza:
          directives:
            - SecRuleEngine DetectionOnly
            - Include @crs-setup.conf.example
            - Include @owasp_crs/*.conf
    waf-block:
      plugin:
        coraza:
          directives:
            - SecRuleEngine On
            - Include @crs-setup.conf.example
            - Include @owasp_crs/*.conf
