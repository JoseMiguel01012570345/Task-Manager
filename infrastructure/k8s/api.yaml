apiVersion: v1
kind: Secret
metadata:
  name: api
  namespace: taskmanagement
type: Opaque
stringData:
  connection: Host=postgres;Port=5432;Database=taskmanagement;Username=taskmanagement;Password=taskmanagement
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taskmanagement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: taskmanagement-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__TaskManagement
              valueFrom:
                secretKeyRef:
                  name: api
                  key: connection
            - name: Authentication__Authority
              value: http://keycloak.taskmanagement.svc.cluster.local:8080/realms/taskmanagement
            - name: Authentication__Audience
              value: taskmanagement-api
            - name: Authentication__RequireHttpsMetadata
              value: "false"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taskmanagement
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
