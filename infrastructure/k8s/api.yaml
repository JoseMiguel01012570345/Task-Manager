apiVersion: v1
kind: Secret
metadata:
  name: api
  namespace: taskmanagement
type: Opaque
stringData:
  connection: Host=postgres-0.postgres.taskmanagement.svc.cluster.local,postgres-1.postgres.taskmanagement.svc.cluster.local,postgres-2.postgres.taskmanagement.svc.cluster.local;Port=5432;Database=taskmanagement;Username=taskmanagement;Password=taskmanagement;Target Session Attributes=primary
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taskmanagement
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: api
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: api
          image: taskmanagement-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: ConnectionStrings__TaskManagement
              valueFrom:
                secretKeyRef:
                  name: api
                  key: connection
            - name: Authentication__Authority
              value: http://keycloak.taskmanagement.svc.cluster.local:8080/realms/taskmanagement
            - name: Authentication__Audience
              value: taskmanagement-api
            - name: Authentication__RequireHttpsMetadata
              value: "false"
            - name: OpenTelemetry__OtlpEndpoint
              value: http://otel-collector.taskmanagement.svc.cluster.local:4317
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: taskmanagement
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
