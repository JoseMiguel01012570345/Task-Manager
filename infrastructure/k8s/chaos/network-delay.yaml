apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: api-network-delay
  namespace: taskmanagement
spec:
  action: delay
  mode: all
  duration: 45s
  selector:
    namespaces:
      - taskmanagement
    labelSelectors:
      app: api
  delay:
    latency: 200ms
    correlation: "0"
    jitter: 50ms
