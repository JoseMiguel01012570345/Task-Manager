apiVersion: batch/v1
kind: Job
metadata:
  name: k6-smoke
  namespace: taskmanagement
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.57.0
          args: ["run", "/scripts/smoke.js"]
          env:
            - name: BASE_URL
              value: http://api.taskmanagement.svc.cluster.local:8080
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-scripts
