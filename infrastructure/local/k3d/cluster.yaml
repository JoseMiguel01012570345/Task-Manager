apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: taskmanagement
servers: 1
agents: 2
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
      # k3s 1.35 exits on cgroup v1 unless this kubelet check is disabled.
      - arg: --kubelet-arg=fail-cgroupv1=false
        nodeFilters:
          - server:*
          - agent:*
